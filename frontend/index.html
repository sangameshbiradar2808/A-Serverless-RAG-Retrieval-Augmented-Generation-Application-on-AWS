<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask Your Documents | Serverless RAG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">AWS · SERVERLESS AI</div>
      <h1>Ask your documents</h1>
      <p class="subtitle">Ask a question and get an answer grounded in your uploaded knowledge base.</p>
    </header>
    <section class="panel">
      <label for="question">Your question</label>
      <textarea id="question" rows="4" placeholder="Example: What is the annual leave policy?"></textarea>
      <div class="actions">
        <span id="status" role="status">Ready</span>
        <button id="askButton">Ask question</button>
      </div>
    </section>
    <section id="answerPanel" class="panel hidden">
      <h2>Answer</h2>
      <div id="answer" class="answer"></div>
      <h3>Sources</h3>
      <div id="sources" class="sources">No sources yet.</div>
    </section>
    <footer>Demo application · Do not upload confidential documents to an unsecured demo.</footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
